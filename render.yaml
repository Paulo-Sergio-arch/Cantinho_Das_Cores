services:
  - type: web
    name: cantinho-das-cores-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: https://cantinho-das-cores.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /var/data/cantinho_das_cores.sqlite3
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: REPORT_DELIVERY_MODE
        value: email
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Cantinho das Cores <onboarding@resend.dev>
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: onboarding@resend.dev
      # IA no relatório (Groq). Sem chave, o relatório usa só os textos aprovados. Ver docs/groq-na-hospedagem.md
      - key: GROQ_API_KEY
        sync: false
      - key: IA_AO_VIVO
        value: "true"
    disk:
      name: cantinho-sqlite-disk
      mountPath: /var/data
      sizeGB: 1
